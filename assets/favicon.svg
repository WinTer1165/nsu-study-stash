<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="NSU Study Stash logo">
  <defs>
    <linearGradient id="nssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#nssBg)"/>
  <!-- stacked books = the "stash" -->
  <g fill="#ffffff">
    <rect x="23" y="60" width="54" height="12" rx="3.5" opacity="0.55"/>
    <rect x="23" y="44" width="54" height="12" rx="3.5" opacity="0.80"/>
    <rect x="23" y="28" width="54" height="12" rx="3.5"/>
  </g>
  <!-- bookmark ribbon on the top book -->
  <path d="M57 24 h9 v22 l-4.5 -4 -4.5 4 z" fill="#f59e0b"/>
</svg>
